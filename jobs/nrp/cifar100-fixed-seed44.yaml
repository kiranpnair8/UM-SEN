apiVersion: batch/v1
kind: Job
metadata:
  name: cifar100-fixed-seed44
  namespace: kc-ai-research-lab
  labels:
    app.kubernetes.io/part-of: umsen-cifar100
    nrp-stage: train
    nrp-run: fixed_seed44
    nrp-source: 01ad13da81ee
    nrp-condition: fixed
    nrp-seed: '44'
  annotations:
    umsen/source-commit: 01ad13da81eed92b64247c5dc3fcd44608f31a1f
    umsen/pvc-access-mode: ReadWriteOnce
    umsen/image-needs-build: 'true'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: umsen-cifar100
        nrp-stage: train
        nrp-run: fixed_seed44
        nrp-source: 01ad13da81ee
        nrp-condition: fixed
        nrp-seed: '44'
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1800
      nodeSelector:
        kubernetes.io/hostname: cph-dgx-node1.humboldt.edu
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runner
        image: ghcr.io/kiranpnair8/um-sen-nrp:torch251-cu121-py310-v1
        imagePullPolicy: IfNotPresent
        command:
        - /opt/nrp/entrypoint.sh
        args:
        - train
        env:
        - name: NRP_ROOT
          value: /storage/umsen-nrp/cifar100-01ad13d-v1
        - name: NRP_RUN_ID
          value: fixed_seed44
        - name: NRP_SEED
          value: '44'
        - name: NRP_CONDITION
          value: fixed
        - name: NRP_SOURCE_COMMIT
          value: 01ad13da81eed92b64247c5dc3fcd44608f31a1f
        - name: NRP_IMAGE
          value: ghcr.io/kiranpnair8/um-sen-nrp:torch251-cu121-py310-v1
        - name: NRP_NODE
          value: cph-dgx-node1.humboldt.edu
        - name: NRP_PVC
          value: umsen-storage
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NODE
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NRP_REVIEWED_BY
          valueFrom:
            configMapKeyRef:
              name: umsen-cifar100-review
              key: reviewed-by
              optional: true
        - name: NRP_ACK_RECIPE
          valueFrom:
            configMapKeyRef:
              name: umsen-cifar100-review
              key: acknowledge-inherited-normalization
              optional: true
        - name: NRP_GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: umsen-github-read
              key: token
              optional: true
        - name: NRP_RESOURCES
          value: '{"cpu": "16", "ephemeral-storage": "8Gi", "memory": "16Gi", "nvidia.com/gpu":
            "1"}'
        resources:
          requests:
            cpu: '16'
            memory: 16Gi
            ephemeral-storage: 8Gi
            nvidia.com/gpu: '1'
          limits:
            cpu: '16'
            memory: 16Gi
            ephemeral-storage: 8Gi
            nvidia.com/gpu: '1'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: storage
          mountPath: /storage
        - name: shm
          mountPath: /dev/shm
        - name: parent-input
          mountPath: /parent-input
          readOnly: true
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: umsen-storage
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      - name: parent-input
        configMap:
          name: umsen-cifar100-parent-selection
          optional: true
